name: Bug report / 问题反馈
description: Report a reproducible problem using anonymized examples.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "请勿上传整个笔记库、原文备份、凭据或私人附件。Please anonymize all examples."
  - type: textarea
    id: environment
    attributes:
      label: Environment / 环境
      description: OS, Obsidian version, plugin version, theme, editor mode and Excalidraw version if relevant.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and minimal Markdown / 步骤与最小示例
      description: Include only anonymous Markdown needed to reproduce. State whether other CSS snippets are enabled.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual / 预期与实际
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Optional sanitized logs / 可选匿名日志
      description: Remove personal file paths, note names and credentials.
